name: Quality checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        run: npm run build

    #   - name: Check Go formatting
    # Change this to linux
    #     shell: pwsh
    #     run: |
    #       $files = @(Get-ChildItem -Path . -Filter '*.go' -File | ForEach-Object FullName)
    #       $unformatted = gofmt -l $files
    #       if ($unformatted) {
    #         Write-Output $unformatted
    #         throw 'Go files must be formatted with gofmt.'
    #       }

      - name: Run go vet
        run: go vet ./...

      - name: Run Go unit tests
        run: go test -coverprofile=coverage.out ./...

      - name: Run gated eBird integration test stub
        run: go test -run '^TestLiveEbirdCatalog$' -v ./...

      - name: Upload Go coverage for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 1

  sonarqube:
    name: SonarQube
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Go coverage report
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@v4
        with:
          name: go-coverage
          path: .

      - name: Scan with SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Explain skipped scan
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SonarQube scan skipped; configure the SONAR_TOKEN repository secret to enable it."
